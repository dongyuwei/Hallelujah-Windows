name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'AUTHORS.txt'
      - 'HACKING.txt'
      - 'LICENSE.txt'
      - 'APACHE-2.0.txt'
      - 'LGPL-2.0.txt'
      - 'PSF.txt'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Unit tests
        run: .\python\python3\virtualenv\Scripts\python.exe .\python\input_methods\hallelujah\test.py
      - name: Install NSIS
        shell: bash
        run: choco install nsis -y --no-progress
      - name: Build IME Text Service
        run: .\build.bat
      - name: Build the installer
        run: cmd /C "C:\Program Files (x86)\NSIS\Bin\makensis.exe" ".\installer\installer.nsi"
      - uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: installer/*.exe

  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Installer
          path: installer
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d ' \r' < version.txt)
          TAG="v${VERSION}.$(date +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
          ASSET="Hallelujah-PIME-${TAG#v}-setup.exe"
          mv "installer/Hallelujah-PIME-$VERSION-setup.exe" "installer/$ASSET"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "installer/$ASSET" --title "PIME $TAG" --generate-notes --prerelease
